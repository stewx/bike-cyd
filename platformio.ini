; Bike CYD ride logger - ESP32-2432S028 "2USB" board (ST7789 display)

[env:cyd2usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two 1.9 MB OTA app slots; NVS stays at 0x9000 so the stored WiFi settings survive.
; A copy of the framework's min_spiffs.csv.
board_build.partitions = partitions.csv
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DFW_VERSION=\"0.2.0\"
    -DCORE_DEBUG_LEVEL=2
    ; Flip these if the colour test bars show the wrong colours
    -DPANEL_INVERT=0
    -DPANEL_BGR=0
    ; Add -DUI_DEMO to show the ride screen with sample data
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    h2zero/NimBLE-Arduino@2.5.1
    ; libsmb2 is vendored in lib/libsmb2

; Firmware update over WiFi: pio run -e cyd2usb_ota -t upload
; (password from ota.txt; the board must have it set with ":ota pass ...")
[env:cyd2usb_ota]
extends = env:cyd2usb
upload_protocol = espota
; the board's IP (no mDNS, to save memory); reserve it in the router's DHCP
upload_port = 192.168.5.74
extra_scripts = post:tools/ota_auth.py
