; Bike CYD ride logger - ESP32-2432S028 "2USB" board (ST7789 display)

[env:cyd2usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two 1.9 MB OTA app slots; NVS stays at 0x9000 so the stored WiFi settings survive.
; A copy of the framework's min_spiffs.csv (hybrid compile needs it in the project).
board_build.partitions = partitions.csv
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=2
    ; Flip these if the colour test bars show the wrong colours
    -DPANEL_INVERT=0
    -DPANEL_BGR=0
    ; Add -DUI_DEMO to show the ride screen with sample data
; Rebuilds the framework libraries with these settings ("hybrid compile").
; WiFi/BLE/TLS together overflow IRAM by a few hundred bytes; keeping the WiFi
; driver's hot paths in flash frees about 20 KB of IRAM.
custom_sdkconfig =
    CONFIG_ESP_WIFI_IRAM_OPT=n
    CONFIG_ESP_WIFI_RX_IRAM_OPT=n
lib_deps =
    lovyan03/LovyanGFX@1.2.30
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3
